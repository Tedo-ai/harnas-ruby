name: live providers

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec bin/smoke_anthropic.rb "say hello in one word"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: bundle exec bin/smoke_openai.rb "say hello in one word"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: bundle exec bin/smoke_gemini.rb "say hello in one word"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
