name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Checkout spec
        uses: actions/checkout@v5
        with:
          repository: Tedo-ai/harnas
          path: harnas-spec
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: HARNAS_SPEC="$GITHUB_WORKSPACE/harnas-spec" ruby bin/check_drift.rb
      - run: HARNAS_SPEC="$GITHUB_WORKSPACE/harnas-spec" bundle exec rspec
      - run: bundle exec rubocop
      - run: HARNAS_SPEC="$GITHUB_WORKSPACE/harnas-spec" bundle exec bin/conformance.rb
      - run: gem build harnas-ruby.gemspec

  packed-conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Checkout spec
        uses: actions/checkout@v5
        with:
          repository: Tedo-ai/harnas
          path: harnas-spec
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem build harnas-ruby.gemspec
      - name: Install packed gem and run conformance
        run: |
          set -euo pipefail
          gem install ./harnas-ruby-*.gem --no-document
          ruby -e 'load Gem::Specification.find_by_name("harnas-ruby").full_gem_path + "/bin/conformance.rb"' -- --fixtures-from "$GITHUB_WORKSPACE/harnas-spec"
